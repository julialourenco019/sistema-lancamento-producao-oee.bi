<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tempo Padrão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        #feedback {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        #feedback.show {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #764ba2;
        }

        .divider {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Adicionar Tempo Padrão</h1>
            <p class="subtitle">Cadastre o tempo padrão para uma fase de produção</p>
        </div>

        <form id="tempoPadraoForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="cod_peca_input">Código da Peça:</label>
                    <input type="text" id="cod_peca_input" name="cod_peca" placeholder="Ex: PCA-001" required>
                </div>
                
                <div class="form-group">
                    <label for="fase_id">Fase:</label>
                    <input type="text" id="fase_id" name="fase_id" placeholder="Ex: F01">
                </div>
            </div>

            <div class="form-group full-width">
                <label for="descricao_fase">Nome da Peça:</label>
                <input type="text" id="descricao_fase" name="descricao_fase" placeholder="Ex: Tampa Superior" required>
            </div>
            
            <div class="form-group">
                <label for="duracao_input">Tempo Padrão (HH:MM:SS):</label>
                <input type="text" id="duracao_input" name="tempo_hh_mm_ss_display" placeholder="01:05:35" maxlength="8" required>
            </div>
            
            <button type="submit" class="btn-submit">CADASTRAR</button>
        </form>

        <div id="feedback"></div>
        
        <hr class="divider">
        <a href="index.html" class="back-link"> Voltar ao Menu Principal</a>
    </div>
    
    <script>
        const WEBHOOK_URL_TEMPO_PADRAO = "https://cloud.activepieces.com/api/v1/webhooks/tjaVRdBvQQlBNnBk9yCfA";

        const duracaoInput = document.getElementById('duracao_input');

        function formatDuration(event) {
            let value = event.target.value.replace(/\D/g, '');
            let formattedValue = '';

            if (value.length > 6) {
                value = value.substring(0, 6);
            }
            
            if (value.length > 0) {
                formattedValue += value.substring(0, 2);
            }
            if (value.length > 2) {
                formattedValue += ':' + value.substring(2, 4);
            }
            if (value.length > 4) {
                formattedValue += ':' + value.substring(4, 6);
            }
            
            event.target.value = formattedValue;
        }
        duracaoInput.addEventListener('input', formatDuration);

        document.getElementById('tempoPadraoForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const form = event.target;
            const feedback = document.getElementById('feedback');
            
            const tempoVisualValue = form.duracao_input.value;
            const tempoValueLimpo = tempoVisualValue.replace(/\D/g, ''); 
            
            if (tempoValueLimpo.length !== 6) {
                feedback.textContent = ' Erro: O Tempo Padrão deve ter 6 dígitos válidos (HH:MM:SS).';
                feedback.style.backgroundColor = '#f8d7da';
                feedback.style.color = '#721c24';
                feedback.classList.add('show');
                return;
            }

            const data = {
                "cod_peca": form.cod_peca.value, 
                "fase_id": form.fase_id.value,
                "descricao_fase": form.descricao_fase.value,
                "tempo_padrao": tempoValueLimpo
            };

            feedback.textContent = 'Enviando dados...';
            feedback.style.backgroundColor = '#fff3cd';
            feedback.style.color = '#856404';
            feedback.classList.add('show');

            fetch(WEBHOOK_URL_TEMPO_PADRAO, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => {
                if (response.ok) {
                    feedback.textContent = ' Tempo Padrão cadastrado com SUCESSO!';
                    feedback.style.backgroundColor = '#d4edda';
                    feedback.style.color = '#155724';
                    form.reset();
                } else {
                    feedback.textContent = ' Erro no envio. Status: ' + response.status;
                    feedback.style.backgroundColor = '#f8d7da';
                    feedback.style.color = '#721c24';
                }
            })
            .catch(error => {
                feedback.textContent = ' Erro de conexão: ' + error.message;
                feedback.style.backgroundColor = '#f8d7da';
                feedback.style.color = '#721c24';
            });
        });
    </script>
</body>
</html>
